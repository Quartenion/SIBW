<!-- Crea una página HTML con: -->
<!-- 1. Un campo de texto para que el usuario escriba su nombre -->
<!-- 2. Un botón con el texto "Saludar" -->
<!-- 3. Un párrafo vacío para mostrar el saludo -->
<!-- 4. Cuando el usuario pulse el botón: -->
    <!-- 4.1: Si el campo está vacío, se debe mostrar el mensaje: "Por favor escribe tu nombre" -->
    <!-- 4.2: Si el campo tiene texto mostrar: "Hola [nombre]!" -->
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <header>
            <h1>CABECERA</h1>
        </header>
        <main>
            <section>
                <input type="text" id="nombre">
            </section>
            <section>
                <button type="submit" id="boton">Saludar</button>
                <p id="texto"></p>
            </section>
        </main>
        <footer>
            PIE DE PÁGINA
        </footer>
        <script src="ejercicio2.js"></script>
    </body>
</html>
